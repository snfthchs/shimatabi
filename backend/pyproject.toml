[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# E/F: 基本的な誤り、I: import の並び、UP: 古い書き方、B: ありがちなバグ
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["app", "tests"]
