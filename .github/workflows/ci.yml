name: CI

# `develop` と `main` へのプルリクエストと、その2ブランチへのpushで、確認を実行する。
# 実行するコマンドは、AGENTS.md の「コマンド」と同じ。秘密情報は使わない
# （テストは、暗号化の鍵を自分で作る。LLMのAPIキーも、使わない）。
on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

permissions:
  contents: read

# 同じブランチで新しい実行が始まったら、古い実行は止める。
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: バックエンド（テスト・lint・型チェック）
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: 依存関係のインストール
        run: pip install -r requirements-dev.txt
      - name: テスト
        run: python -m pytest
      - name: lint
        run: python -m ruff check .
      - name: format-check
        run: python -m ruff format --check .
      - name: 型チェック
        run: python -m mypy

  frontend:
    name: フロントエンド（lint・format-check・型チェック・ビルド）
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: 依存関係のインストール
        run: npm ci
      - name: lint
        run: npm run lint
      - name: format-check
        run: npm run format:check
      - name: 型チェック
        run: npm run typecheck
      - name: ビルド
        run: npm run build
